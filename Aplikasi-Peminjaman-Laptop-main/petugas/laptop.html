<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Data Laptop - Lab Laptop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/validator.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    const user = guard(['petugas']);
    if (user) {
      layout('Data Laptop', 'petugas', 'Data Laptop');
      document.getElementById('content').innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-5">
          <div>
            <h2 class="text-2xl font-bold text-slate-900">Inventaris Laptop Laboratorium</h2>
            <p class="text-sm text-slate-500">Pantau ketersediaan, pemeliharaan, dan update kondisi fisik unit.</p>
          </div>
          <div class="flex items-center gap-2 text-sm text-slate-500 bg-white px-3 py-1.5 rounded-xl border border-slate-200">
            <span id="count"></span>
            <i data-lucide="laptop" class="w-4 h-4 text-teal-600"></i>
          </div>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-5 flex flex-col sm:flex-row gap-3 shadow-sm">
          <div class="relative flex-1">
            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
            <input id="search" class="input pl-9" placeholder="Cari nama, kode, merk, model, atau lokasi...">
          </div>
          <select id="filter" class="input sm:max-w-52">
            <option value="Semua status">Semua Status</option>
            <option value="Tersedia">Tersedia</option>
            <option value="Dipinjam">Dipinjam</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Rusak">Rusak</option>
          </select>
        </div>
        <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4" id="cards"></div>
      `;
      lucide.createIcons();

      function render() {
        const l = DB.get('laptops');
        const q = document.getElementById('search').value.toLowerCase();
        const f = document.getElementById('filter').value;
        const data = l.filter(x => (f === 'Semua status' || x.status === f) && [x.name, x.code, x.brand, x.model, x.location].join(' ').toLowerCase().includes(q));

        document.getElementById('count').textContent = data.length + ' perangkat';
        document.getElementById('cards').innerHTML = data.map(x => `
          <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start">
                <div class="h-11 w-11 rounded-xl bg-teal-50 text-teal-700 grid place-items-center">
                  <i data-lucide="laptop"></i>
                </div>
                ${badge(x.status)}
              </div>
              <h3 class="font-bold text-slate-800 mt-4">${esc(x.name)}</h3>
              <p class="text-sm text-slate-500 font-mono">${esc(x.code)} • ${esc(x.brand)} ${esc(x.model)}</p>
              <div class="mt-4 text-xs text-slate-600 space-y-1.5 pt-3 border-t border-slate-100">
                <p><b>Spek:</b> ${esc(x.processor)} • RAM ${esc(x.ram)} • ${esc(x.storage)}</p>
                <p><b>Kondisi:</b> <span class="font-semibold text-slate-700">${esc(x.condition)}</span></p>
                <p class="text-slate-400 flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i>${esc(x.location)}</p>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100">
              <button onclick="updateConditionModal(${x.id})" class="btn-secondary w-full text-xs py-2">
                <i data-lucide="wrench" class="w-3.5 h-3.5"></i> Update Kondisi
              </button>
            </div>
          </div>
        `).join('') || '<div class="sm:col-span-2 xl:col-span-3 bg-white border border-dashed rounded-2xl p-10 text-center text-slate-400"><i data-lucide="search-x" class="mx-auto w-8 h-8 mb-3"></i><p class="font-semibold text-slate-600">Laptop tidak ditemukan</p><p class="text-sm mt-1">Coba ubah kata kunci atau filter status.</p></div>';

        lucide.createIcons();
      }

      window.updateConditionModal = function(id) {
        const l = DB.get('laptops').find(x => x.id === id);
        if (!l) return;

        modal(
          'Update Kondisi Laptop: ' + esc(l.name) + ' (' + esc(l.code) + ')',
          `
          <form id="condForm" class="space-y-4" novalidate>
            <div>
              <label class="label">Status Ketersediaan</label>
              <select id="laptopStatus" name="laptopStatus" class="input">
                <option value="Tersedia" ${l.status === 'Tersedia' ? 'selected' : ''}>Tersedia</option>
                <option value="Dipinjam" ${l.status === 'Dipinjam' ? 'selected' : ''} ${l.status === 'Dipinjam' ? '' : 'disabled'}>Dipinjam</option>
                <option value="Maintenance" ${l.status === 'Maintenance' ? 'selected' : ''}>Maintenance</option>
                <option value="Rusak" ${l.status === 'Rusak' ? 'selected' : ''}>Rusak</option>
              </select>
            </div>
            <div>
              <label class="label">Kondisi Fisik</label>
              <select id="laptopCondition" name="laptopCondition" class="input">
                <option value="Baik" ${l.condition === 'Baik' ? 'selected' : ''}>Baik</option>
                <option value="Perlu diperiksa" ${l.condition === 'Perlu diperiksa' ? 'selected' : ''}>Perlu diperiksa</option>
                <option value="Rusak Ringan" ${l.condition === 'Rusak Ringan' ? 'selected' : ''}>Rusak Ringan</option>
                <option value="Rusak Berat" ${l.condition === 'Rusak Berat' ? 'selected' : ''}>Rusak Berat</option>
              </select>
            </div>
            <div>
              <label class="label">Lokasi</label>
              <input id="laptopLocation" name="laptopLocation" class="input" value="${esc(l.location || 'Lab RPL')}">
            </div>
          </form>
          `,
          `
          <button onclick="closeModal()" class="btn-secondary">Batal</button>
          <button onclick="saveLaptopCondition(${id})" class="btn-primary">
            <i data-lucide="shield-check"></i> Simpan (Prepared)
          </button>
          `
        );
        lucide.createIcons();
      };

      window.saveLaptopCondition = function(id) {
        const status = document.getElementById('laptopStatus').value;
        const condition = document.getElementById('laptopCondition').value;
        const location = document.getElementById('laptopLocation').value.trim() || 'Lab RPL';

        const stmt = DB.prepare("UPDATE laptops SET status = ?, condition = ?, location = ? WHERE id = ?");
        stmt.execute([status, condition, location, id]);

        closeModal();
        toast('Status dan kondisi laptop berhasil diperbarui (Prepared Statement)');
        render();
      };

      document.getElementById('search').addEventListener('input', render);
      document.getElementById('filter').addEventListener('change', render);
      render();
    }
  </script>
</body>
</html>
