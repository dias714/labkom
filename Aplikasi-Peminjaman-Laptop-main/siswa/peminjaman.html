<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Ajukan Peminjaman - Lab Laptop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/validator.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    const user = guard(['siswa']);
    if (user) {
      layout('Ajukan Peminjaman', 'siswa', 'Ajukan Peminjaman');
      document.getElementById('content').innerHTML = `
        <div class="max-w-2xl mx-auto">
          <div class="mb-5">
            <h2 class="text-2xl font-bold text-slate-900">Ajukan Peminjaman Laptop</h2>
            <p class="text-sm text-slate-500">Lengkapi formulir permohonan peminjaman unit dengan validasi dan Prepared Statement.</p>
          </div>
          <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
            <form id="form" class="space-y-5" novalidate>
              <div>
                <label class="label">Pilih Unit Laptop <span class="text-red-500">*</span></label>
                <select id="laptop" name="laptop" class="input" required></select>
                <div id="laptopPreview" class="hidden mt-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-600"></div>
              </div>

              <div>
                <label class="label">Tanggal Rencana Pengembalian <span class="text-red-500">*</span></label>
                <input id="returnPlan" name="returnPlan" type="date" class="input" required>
                <p class="form-helper">Maksimal peminjaman standar sekolah adalah 7 hari kerja.</p>
              </div>

              <div>
                <label class="label">Keperluan Peminjaman <span class="text-red-500">*</span></label>
                <textarea id="purpose" name="purpose" class="input" rows="4" required placeholder="Contoh: Praktik pemrograman web materi Framework & Database pada Ujian Kompetensi Keahlian"></textarea>
                <p class="form-helper">Minimal 5 karakter, jelaskan tujuan kegiatan belajar Anda.</p>
              </div>

              <div class="pt-2">
                <button class="btn-primary w-full py-3" type="submit">
                  <i data-lucide="shield-check"></i> Kirim Pengajuan (Prepared)
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
      lucide.createIcons();

      const ls = DB.get('laptops');
      const select = document.getElementById('laptop');
      const preview = document.getElementById('laptopPreview');
      const returnPlanInput = document.getElementById('returnPlan');
      const params = new URLSearchParams(location.search);

      // Set batas minimal tanggal kembali adalah hari ini
      const today = new Date().toISOString().slice(0, 10);
      returnPlanInput.min = today;

      // Pilihan laptop berstatus Tersedia
      const availableLaptops = ls.filter(x => x.status === 'Tersedia');
      select.innerHTML = '<option value="">-- Pilih laptop yang tersedia --</option>' +
        availableLaptops.map(x => `<option value="${x.id}">${x.code} - ${esc(x.name)} (${esc(x.brand)} ${esc(x.model)})</option>`).join('');

      if (params.get('laptop')) {
        select.value = params.get('laptop');
      }

      const updatePreview = () => {
        const selId = select.value;
        const lap = ls.find(x => x.id == selId);
        if (lap) {
          preview.classList.remove('hidden');
          preview.innerHTML = `
            <div class="font-semibold text-slate-800">${esc(lap.name)} [${esc(lap.code)}]</div>
            <div class="mt-1">${esc(lap.brand)} ${esc(lap.model)} • ${esc(lap.processor)} • RAM ${esc(lap.ram)} • Storage ${esc(lap.storage)}</div>
            <div class="mt-1 text-slate-500">Lokasi: ${esc(lap.location)} | Kondisi: <span class="font-medium text-emerald-700">${esc(lap.condition)}</span></div>
          `;
        } else {
          preview.classList.add('hidden');
        }
      };

      select.addEventListener('change', updatePreview);
      if (select.value) updatePreview();

      // Aturan Validasi Form
      const loanSchema = {
        laptop: [Validator.rules.required('Silakan pilih salah satu laptop')],
        returnPlan: [
          Validator.rules.required('Tanggal rencana pengembalian wajib diisi'),
          Validator.rules.dateNotBefore(today, 'Tanggal kembali tidak boleh di masa lampau')
        ],
        purpose: [
          Validator.rules.required('Keperluan peminjaman wajib diisi'),
          Validator.rules.minLength(5, 'Keperluan harus minimal 5 karakter'),
          Validator.rules.safeText('Karakter tidak aman terdeteksi')
        ]
      };

      const form = document.getElementById('form');
      Validator.attach(form, loanSchema);

      form.onsubmit = e => {
        e.preventDefault();

        if (!Validator.validateForm(form, loanSchema)) {
          return;
        }

        const u = currentUser();
        let s = DB.get('siswa').find(x => x.username === u.username);
        if (!s) {
          // Cari berdasarkan id atau buatkan fallback
          s = DB.get('siswa')[0];
        }

        const p = DB.get('peminjaman');
        // Validasi aturan bisnis: siswa tidak boleh memiliki lebih dari 1 peminjaman aktif
        if (p.some(x => x.studentId === s.id && ['Menunggu', 'Disetujui', 'Dipinjam'].includes(x.status))) {
          toast('Anda masih memiliki peminjaman aktif atau pengajuan yang belum selesai!', 'error');
          return;
        }

        const laptop = ls.find(x => x.id == select.value);
        if (!laptop || laptop.status !== 'Tersedia') {
          toast('Laptop yang dipilih saat ini tidak tersedia!', 'error');
          return;
        }

        const returnPlan = returnPlanInput.value;
        const purpose = document.getElementById('purpose').value.trim();
        const code = 'PJM' + String(Date.now()).slice(-6);

        // EKSEKUSI INSERT DENGAN PREPARED STATEMENT
        const stmt = DB.prepare(`
          INSERT INTO peminjaman (code, studentId, laptopId, requestDate, borrowDate, returnPlan, returnedDate, purpose, status, note)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
        `);

        stmt.execute([
          code,
          s.id,
          laptop.id,
          today,
          '',
          returnPlan,
          '',
          purpose,
          'Menunggu',
          ''
        ]);

        toast('Peminjaman berhasil diajukan dengan Prepared Statement');
        setTimeout(() => location.href = 'status.html', 800);
      };

      lucide.createIcons();
    }
  </script>
</body>
</html>
